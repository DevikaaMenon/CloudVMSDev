name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-vms/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Docker image
          cache: pip
          cache-dependency-path: cloud-vms/backend/requirements.txt
      - name: Install dependencies (CPU-only PyTorch keeps the download small)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-vms/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-vms/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
